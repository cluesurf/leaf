packages:
  - 'code'

# Centralized version pins. Sub-packages reference these via
# `"<pkg>": "catalog:"` in their own package.json so a version
# bump only happens here. Mirrors the mesh repo's pattern.
catalog:
  '@cluesurf/wash': 0.8.0
  '@formatjs/intl': 3.1.6
  '@types/fs-extra': 11.0.4
  '@types/lodash-es': 4.17.12
  '@types/node': 25.6.0
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  '@types/yargs': 17.0.35
  concurrently: 9.2.1
  dotenv: 17.4.2
  fs-extra: 11.3.4
  js-yaml: 4.1.1
  lodash-es: ^4.18.1
  p-limit: 7.3.0
  prettier: 3.8.1
  react: 19.2.5
  react-dom: 19.2.5
  ts-morph: 27.0.2
  ts-node: ^10.9.2
  tsc-alias: 1.8.16
  tsx: 4.21.0
  turbo: ^2.6.2
  typescript: 6.0.2
  vite: 8.0.8
  vitest: 4.1.5
  yaml: ^2.8.4
  yargs: 18.0.0
  zod: 4.3.6

pnpm:
  overrides:
    '@isaacs/brace-expansion': '>=5.0.1'
